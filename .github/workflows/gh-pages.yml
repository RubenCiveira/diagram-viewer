# Compila y publica una demo en GitHub Pages en cada push a main:
#   pnpm run build → release/<versión>/diagram-viewer.html → index.html
#   release/<versión>/config.js           → config.js
#   example/*                             → raíz (index.json, public/…)
#
# Se publica en la rama gh-pages: en Settings → Pages → Source, "Deploy from a branch" → gh-pages / (root).
name: gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión de pnpm tomada de "packageManager" en package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Montar el sitio
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          RELEASE="release/$VERSION"
          test -f "$RELEASE/diagram-viewer.html" || { echo "::error::Falta $RELEASE/diagram-viewer.html"; exit 1; }

          mkdir -p _site
          cp -R example/. _site/
          cp "$RELEASE/diagram-viewer.html" _site/index.html
          cp "$RELEASE/config.js" _site/config.js
          ls -R _site | head -50

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
